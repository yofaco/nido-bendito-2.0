<!-- templates/header.html -->
<header class="header" id="header">
    <nav class="nav container">
        <a href="index.html" class="nav__logo">
            <i class="fas fa-feather"></i>
            Nido Bendito
        </a>

        <div class="nav__menu" id="nav-menu">
            <ul class="nav__list">
                <li class="nav__item">
                    <a href="index.html" class="nav__link" data-page="index">Inicio</a>
                </li>
                <li class="nav__item">
                    <a href="tienda.html" class="nav__link" data-page="tienda">Tienda</a>
                </li>
                <li class="nav__item">
                    <a href="nosotros.html" class="nav__link" data-page="nosotros">Nosotros</a>
                </li>
                <li class="nav__item">
                    <a href="historias.html" class="nav__link" data-page="historias">Historias</a>
                </li>
                <li class="nav__item">
                    <a href="envio.html" class="nav__link" data-page="envio">Envío</a>
                </li>
            </ul>

            <div class="nav__close" id="nav-close">
                <i class="fas fa-times"></i>
            </div>
        </div>

        <div class="nav__actions">
            <!-- Search Toggle -->
            <div class="nav__search-toggle" id="search-toggle">
                <i class="fas fa-search"></i>
            </div>

            <!-- Wishlist -->
            <a href="wishlist.html" class="nav__action-btn" id="wishlist-btn">
                <i class="far fa-heart"></i>
                <span class="nav__action-count" id="wishlist-count">0</span>
            </a>

            <!-- Cart -->
            <a href="carrito.html" class="nav__action-btn" id="cart-btn">
                <i class="fas fa-shopping-cart"></i>
                <span class="nav__action-count" id="cart-count">0</span>
            </a>

            <!-- Theme Toggle -->
            <div class="nav__theme-toggle" id="theme-toggle">
                <i class="fas fa-moon"></i>
            </div>

            <!-- Mobile Menu Toggle -->
            <div class="nav__toggle" id="nav-toggle">
                <i class="fas fa-bars"></i>
            </div>
        </div>

        <!-- Search Bar -->
        <div class="search-bar" id="search-bar">
            <div class="search-bar__container container">
                <form class="search-bar__form" id="search-form">
                    <input type="text" 
                           class="search-bar__input" 
                           id="search-input"
                           placeholder="Buscar productos...">
                    <button type="submit" class="search-bar__submit">
                        <i class="fas fa-search"></i>
                    </button>
                </form>
                <button class="search-bar__close" id="search-close">
                    <i class="fas fa-times"></i>
                </button>
            </div>

            <!-- Search Results -->
            <div class="search-results" id="search-results">
                <div class="search-results__container container">
                    <div class="search-results__content" id="search-results-content">
                        <!-- Los resultados de búsqueda se cargan aquí dinámicamente -->
                    </div>
                </div>
            </div>
        </div>
    </nav>
</header>

<!-- Mobile Menu Overlay -->
<div class="mobile-overlay" id="mobile-overlay"></div>

<style>
    /* Header Styles */
    .header {
        width: 100%;
        background-color: var(--container-color);
        position: fixed;
        top: 0;
        left: 0;
        z-index: var(--z-fixed);
        box-shadow: 0 1px 4px rgba(0, 0, 0, 0.1);
        transition: all 0.3s ease;
    }

    .header.scrolled {
        box-shadow: 0 2px 20px rgba(0, 0, 0, 0.1);
    }

    .nav {
        height: var(--header-height);
        display: flex;
        justify-content: space-between;
        align-items: center;
        position: relative;
    }

    .nav__logo {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        font-weight: var(--font-semi-bold);
        color: var(--title-color);
        font-size: var(--h3-font-size);
        transition: color 0.3s ease;
    }

    .nav__logo:hover {
        color: var(--primary-color);
    }

    .nav__logo i {
        color: var(--secondary-color);
        font-size: 1.5rem;
    }

    .nav__actions {
        display: flex;
        align-items: center;
        gap: 1rem;
    }

    .nav__action-btn {
        position: relative;
        width: 40px;
        height: 40px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--body-color);
        border-radius: 50%;
        color: var(--title-color);
        transition: all 0.3s ease;
    }

    .nav__action-btn:hover {
        background: var(--primary-color);
        color: white;
        transform: translateY(-2px);
    }

    .nav__action-count {
        position: absolute;
        top: -5px;
        right: -5px;
        background: var(--secondary-color);
        color: white;
        font-size: 0.75rem;
        font-weight: var(--font-bold);
        width: 18px;
        height: 18px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        line-height: 1;
    }

    .nav__theme-toggle,
    .nav__search-toggle,
    .nav__toggle {
        width: 40px;
        height: 40px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--body-color);
        border-radius: 50%;
        color: var(--title-color);
        cursor: pointer;
        transition: all 0.3s ease;
    }

    .nav__theme-toggle:hover,
    .nav__search-toggle:hover,
    .nav__toggle:hover {
        background: var(--primary-color);
        color: white;
        transform: translateY(-2px);
    }

    /* Navigation Menu */
    .nav__menu {
        position: static;
        background: transparent;
        padding: 0;
        box-shadow: none;
        transition: none;
    }

    .nav__list {
        display: flex;
        gap: 2rem;
        margin: 0;
    }

    .nav__link {
        color: var(--title-color);
        font-weight: var(--font-medium);
        transition: color 0.3s ease;
        position: relative;
        padding: 0.5rem 0;
    }

    .nav__link:hover {
        color: var(--primary-color);
    }

    .nav__link.active {
        color: var(--primary-color);
    }

    .nav__link.active::after {
        content: '';
        position: absolute;
        bottom: 0;
        left: 0;
        width: 100%;
        height: 2px;
        background: var(--primary-color);
        border-radius: 2px;
    }

    .nav__close {
        display: none;
    }

    /* Search Bar */
    .search-bar {
        position: absolute;
        top: 100%;
        left: 0;
        width: 100%;
        background: var(--container-color);
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        transform: translateY(-10px);
        opacity: 0;
        visibility: hidden;
        transition: all 0.3s ease;
        z-index: var(--z-modal);
    }

    .search-bar.active {
        transform: translateY(0);
        opacity: 1;
        visibility: visible;
    }

    .search-bar__container {
        padding: 1rem 0;
        display: flex;
        align-items: center;
        gap: 1rem;
    }

    .search-bar__form {
        flex: 1;
        position: relative;
    }

    .search-bar__input {
        width: 100%;
        padding: 0.75rem 1rem;
        padding-right: 3rem;
        border: 2px solid var(--body-color);
        border-radius: 2rem;
        font-size: var(--normal-font-size);
        background: var(--body-color);
        transition: all 0.3s ease;
    }

    .search-bar__input:focus {
        outline: none;
        border-color: var(--primary-color);
        background: white;
        box-shadow: 0 0 0 3px rgba(74, 101, 114, 0.1);
    }

    .search-bar__submit {
        position: absolute;
        right: 0.5rem;
        top: 50%;
        transform: translateY(-50%);
        background: var(--primary-color);
        color: white;
        border: none;
        border-radius: 50%;
        width: 36px;
        height: 36px;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: all 0.3s ease;
    }

    .search-bar__submit:hover {
        background: var(--primary-color-dark);
        transform: translateY(-50%) scale(1.05);
    }

    .search-bar__close {
        background: none;
        border: none;
        color: var(--text-color-light);
        font-size: 1.25rem;
        cursor: pointer;
        padding: 0.5rem;
        border-radius: 50%;
        transition: all 0.3s ease;
    }

    .search-bar__close:hover {
        background: var(--body-color);
        color: var(--title-color);
    }

    /* Search Results */
    .search-results {
        background: white;
        border-top: 1px solid var(--body-color);
        max-height: 400px;
        overflow-y: auto;
        display: none;
    }

    .search-results.active {
        display: block;
    }

    .search-results__container {
        padding: 1rem 0;
    }

    .search-result-item {
        display: flex;
        align-items: center;
        gap: 1rem;
        padding: 1rem;
        border-bottom: 1px solid var(--body-color);
        transition: background 0.3s ease;
        cursor: pointer;
    }

    .search-result-item:hover {
        background: var(--body-color);
    }

    .search-result-item:last-child {
        border-bottom: none;
    }

    .search-result-item__image {
        width: 60px;
        height: 60px;
        border-radius: 8px;
        overflow: hidden;
        flex-shrink: 0;
    }

    .search-result-item__image img {
        width: 100%;
        height: 100%;
        object-fit: cover;
    }

    .search-result-item__content {
        flex: 1;
    }

    .search-result-item__name {
        font-weight: var(--font-medium);
        color: var(--title-color);
        margin-bottom: 0.25rem;
    }

    .search-result-item__price {
        color: var(--primary-color);
        font-weight: var(--font-semi-bold);
    }

    .search-results__empty {
        text-align: center;
        padding: 2rem;
        color: var(--text-color-light);
    }

    .search-results__empty i {
        font-size: 2rem;
        margin-bottom: 1rem;
        opacity: 0.5;
    }

    /* Mobile Overlay */
    .mobile-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.5);
        z-index: var(--z-fixed);
        opacity: 0;
        visibility: hidden;
        transition: all 0.3s ease;
    }

    .mobile-overlay.active {
        opacity: 1;
        visibility: visible;
    }

    /* Responsive Design */
    @media screen and (max-width: 968px) {
        .nav__menu {
            position: fixed;
            top: 0;
            right: -100%;
            width: 280px;
            height: 100vh;
            background: var(--container-color);
            padding: 5rem 2rem 2rem;
            box-shadow: -4px 0 20px rgba(0, 0, 0, 0.1);
            transition: right 0.3s ease;
            z-index: var(--z-fixed);
        }

        .nav__menu.active {
            right: 0;
        }

        .nav__list {
            flex-direction: column;
            gap: 1.5rem;
        }

        .nav__link {
            padding: 0.75rem 0;
            font-size: var(--h3-font-size);
        }

        .nav__close {
            display: flex;
            position: absolute;
            top: 1.5rem;
            right: 1.5rem;
            font-size: 1.5rem;
            color: var(--title-color);
            cursor: pointer;
        }

        .nav__actions {
            gap: 0.75rem;
        }

        .nav__action-btn,
        .nav__theme-toggle,
        .nav__search-toggle,
        .nav__toggle {
            width: 36px;
            height: 36px;
            font-size: 0.9rem;
        }
    }

    @media screen and (max-width: 576px) {
        .nav__logo span {
            display: none;
        }

        .nav__actions {
            gap: 0.5rem;
        }

        .search-bar__container {
            padding: 0.75rem;
        }

        .search-result-item {
            padding: 0.75rem;
        }

        .search-result-item__image {
            width: 50px;
            height: 50px;
        }
    }

    /* Dark Theme Support */
    .dark-theme .header {
        background: var(--container-color-dark);
        box-shadow: 0 1px 4px rgba(0, 0, 0, 0.2);
    }

    .dark-theme .search-bar {
        background: var(--container-color-dark);
    }

    .dark-theme .search-results {
        background: var(--container-color-dark);
        border-top-color: var(--border-color-dark);
    }

    .dark-theme .search-result-item {
        border-bottom-color: var(--border-color-dark);
    }

    .dark-theme .search-result-item:hover {
        background: var(--body-color-dark);
    }
</style>

<script>
    // Header Component Script
    class HeaderComponent {
        constructor() {
            this.currentPage = this.getCurrentPage();
            this.init();
        }

        init() {
            this.setActiveLink();
            this.setupEventListeners();
            this.updateCartCounter();
            this.updateWishlistCounter();
        }

        getCurrentPage() {
            const path = window.location.pathname;
            const page = path.split('/').pop() || 'index.html';
            return page.replace('.html', '');
        }

        setActiveLink() {
            const links = document.querySelectorAll('.nav__link[data-page]');
            links.forEach(link => {
                if (link.dataset.page === this.currentPage) {
                    link.classList.add('active');
                } else {
                    link.classList.remove('active');
                }
            });
        }

        setupEventListeners() {
            // Mobile menu toggle
            const navToggle = document.getElementById('nav-toggle');
            const navClose = document.getElementById('nav-close');
            const navMenu = document.getElementById('nav-menu');
            const mobileOverlay = document.getElementById('mobile-overlay');

            if (navToggle && navMenu) {
                navToggle.addEventListener('click', () => {
                    navMenu.classList.add('active');
                    mobileOverlay.classList.add('active');
                    document.body.style.overflow = 'hidden';
                });
            }

            if (navClose && navMenu) {
                navClose.addEventListener('click', () => {
                    navMenu.classList.remove('active');
                    mobileOverlay.classList.remove('active');
                    document.body.style.overflow = '';
                });
            }

            if (mobileOverlay) {
                mobileOverlay.addEventListener('click', () => {
                    navMenu.classList.remove('active');
                    mobileOverlay.classList.remove('active');
                    document.body.style.overflow = '';
                });
            }

            // Search functionality
            this.setupSearch();
            
            // Theme toggle
            this.setupThemeToggle();

            // Scroll effect
            this.setupScrollEffect();
        }

        setupSearch() {
            const searchToggle = document.getElementById('search-toggle');
            const searchClose = document.getElementById('search-close');
            const searchBar = document.getElementById('search-bar');
            const searchInput = document.getElementById('search-input');
            const searchForm = document.getElementById('search-form');
            const searchResults = document.getElementById('search-results');
            const searchResultsContent = document.getElementById('search-results-content');

            if (searchToggle && searchBar) {
                searchToggle.addEventListener('click', () => {
                    searchBar.classList.toggle('active');
                    if (searchBar.classList.contains('active')) {
                        searchInput.focus();
                    }
                });
            }

            if (searchClose && searchBar) {
                searchClose.addEventListener('click', () => {
                    searchBar.classList.remove('active');
                    searchResults.classList.remove('active');
                });
            }

            // Search input handling
            if (searchInput) {
                let searchTimeout;
                searchInput.addEventListener('input', (e) => {
                    clearTimeout(searchTimeout);
                    searchTimeout = setTimeout(() => {
                        this.handleSearch(e.target.value);
                    }, 300);
                });

                searchInput.addEventListener('focus', () => {
                    if (searchInput.value) {
                        this.handleSearch(searchInput.value);
                    }
                });
            }

            // Search form submission
            if (searchForm) {
                searchForm.addEventListener('submit', (e) => {
                    e.preventDefault();
                    const query = searchInput.value.trim();
                    if (query) {
                        window.location.href = `tienda.html?search=${encodeURIComponent(query)}`;
                    }
                });
            }

            // Close search when clicking outside
            document.addEventListener('click', (e) => {
                if (!searchBar.contains(e.target) && !searchToggle.contains(e.target)) {
                    searchBar.classList.remove('active');
                    searchResults.classList.remove('active');
                }
            });
        }

        async handleSearch(query) {
            const searchResults = document.getElementById('search-results');
            const searchResultsContent = document.getElementById('search-results-content');

            if (!query.trim()) {
                searchResults.classList.remove('active');
                return;
            }

            if (window.productsLoader) {
                const results = window.productsLoader.filterProducts({ search: query });
                this.displaySearchResults(results.slice(0, 5));
            } else {
                // Fallback si productsLoader no está disponible
                searchResultsContent.innerHTML = `
                    <div class="search-results__empty">
                        <i class="fas fa-search"></i>
                        <p>Buscando productos...</p>
                    </div>
                `;
                searchResults.classList.add('active');
            }
        }

        displaySearchResults(products) {
            const searchResults = document.getElementById('search-results');
            const searchResultsContent = document.getElementById('search-results-content');

            if (products.length === 0) {
                searchResultsContent.innerHTML = `
                    <div class="search-results__empty">
                        <i class="fas fa-search"></i>
                        <p>No se encontraron productos</p>
                    </div>
                `;
            } else {
                const resultsHTML = products.map(product => `
                    <div class="search-result-item" onclick="window.location.href='../pages/producto/${product.id}.html'">
                        <div class="search-result-item__image">
                            <img src="${product.images?.[0] || '../assets/images/placeholder.jpg'}" 
                                 alt="${product.name}"
                                 onerror="this.src='../assets/images/placeholder.jpg'">
                        </div>
                        <div class="search-result-item__content">
                            <div class="search-result-item__name">${product.name}</div>
                            <div class="search-result-item__price">$${product.price.toFixed(2)}</div>
                        </div>
                    </div>
                `).join('');

                searchResultsContent.innerHTML = resultsHTML;
            }

            searchResults.classList.add('active');
        }

        setupThemeToggle() {
            const themeToggle = document.getElementById('theme-toggle');
            const themeIcon = themeToggle?.querySelector('i');

            // Check for saved theme preference or respect OS preference
            const savedTheme = localStorage.getItem('theme') || 
                              (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
            
            this.setTheme(savedTheme);

            if (themeToggle && themeIcon) {
                themeToggle.addEventListener('click', () => {
                    const currentTheme = document.body.classList.contains('dark-theme') ? 'dark' : 'light';
                    const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
                    this.setTheme(newTheme);
                });
            }
        }

        setTheme(theme) {
            const themeToggle = document.getElementById('theme-toggle');
            const themeIcon = themeToggle?.querySelector('i');

            if (theme === 'dark') {
                document.body.classList.add('dark-theme');
                if (themeIcon) {
                    themeIcon.className = 'fas fa-sun';
                }
            } else {
                document.body.classList.remove('dark-theme');
                if (themeIcon) {
                    themeIcon.className = 'fas fa-moon';
                }
            }

            localStorage.setItem('theme', theme);
        }

        setupScrollEffect() {
            const header = document.getElementById('header');
            let lastScrollY = window.scrollY;

            window.addEventListener('scroll', () => {
                if (window.scrollY > 100) {
                    header.classList.add('scrolled');
                } else {
                    header.classList.remove('scrolled');
                }

                lastScrollY = window.scrollY;
            });
        }

        updateCartCounter() {
            const cartCount = document.getElementById('cart-count');
            if (cartCount) {
                const cart = JSON.parse(localStorage.getItem('nidoBenditoCart') || '[]');
                const totalItems = cart.reduce((sum, item) => sum + item.quantity, 0);
                cartCount.textContent = totalItems;
                cartCount.style.display = totalItems > 0 ? 'flex' : 'none';
            }
        }

        updateWishlistCounter() {
            const wishlistCount = document.getElementById('wishlist-count');
            if (wishlistCount) {
                const wishlist = JSON.parse(localStorage.getItem('nidoBenditoWishlist') || '[]');
                wishlistCount.textContent = wishlist.length;
                wishlistCount.style.display = wishlist.length > 0 ? 'flex' : 'none';
            }
        }
    }

    // Initialize header when DOM is loaded
    document.addEventListener('DOMContentLoaded', () => {
        window.headerComponent = new HeaderComponent();
    });

    // Export for use in other modules
    if (typeof module !== 'undefined' && module.exports) {
        module.exports = HeaderComponent;
    }
</script>
