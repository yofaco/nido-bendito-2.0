<!-- templates/product-card.html -->
<template id="product-card-template">
    <div class="product-card" data-product-id="{{id}}">
        {{#if featured}}
        <span class="product-card__badge">Destacado</span>
        {{/if}}
        
        {{#if comparePrice}}
        <span class="product-card__discount-badge">
            -{{calculateDiscount price comparePrice}}%
        </span>
        {{/if}}

        <div class="product-card__image">
            <img src="{{mainImage}}" 
                 alt="{{name}}" 
                 class="product-card__img"
                 loading="lazy"
                 onerror="this.src='../assets/images/placeholder.jpg'">
            
            <div class="product-card__overlay">
                <button class="product-card__quick-view" data-product-id="{{id}}" aria-label="Vista rápida">
                    <i class="fas fa-eye"></i>
                </button>
                <button class="product-card__wishlist" data-product-id="{{id}}" aria-label="Agregar a favoritos">
                    <i class="{{wishlistIcon}}"></i>
                </button>
            </div>

            {{#if stock}}
            {{#lt stock 5}}
            <div class="product-card__stock-badge">
                <i class="fas fa-exclamation-triangle"></i>
                Últimas {{stock}} unidades
            </div>
            {{/lt}}
            {{/if}}
        </div>

        <div class="product-card__content">
            <div class="product-card__category">{{categoryName}}</div>
            
            <h3 class="product-card__title">
                <a href="../pages/producto/{{id}}.html" class="product-card__link">
                    {{name}}
                </a>
            </h3>
            
            <p class="product-card__description">{{truncate description 100}}</p>

            <div class="product-card__price">
                <span class="product-card__price-current">${{formatPrice price}}</span>
                {{#if comparePrice}}
                <span class="product-card__price-compare">${{formatPrice comparePrice}}</span>
                {{/if}}
            </div>

            {{#if specifications}}
            <div class="product-card__specs">
                {{#each (limit specifications 2)}}
                <div class="product-spec">
                    <span class="product-spec__key">{{@key}}:</span>
                    <span class="product-spec__value">{{this}}</span>
                </div>
                {{/each}}
            </div>
            {{/if}}

            <div class="product-card__actions">
                <button class="button button--primary product-card__add-to-cart" 
                        data-product-id="{{id}}"
                        {{#if (eq stock 0)}}disabled{{/if}}>
                    <i class="fas fa-shopping-cart"></i>
                    {{#if (eq stock 0)}}Agotado{{else}}Agregar al Carrito{{/if}}
                </button>
                <a href="../pages/producto/{{id}}.html" 
                   class="button button--outline product-card__view-details">
                    Ver Detalles
                </a>
            </div>

            <div class="product-card__meta">
                {{#if sku}}
                <div class="product-card__sku">
                    <span class="product-card__meta-label">SKU:</span>
                    <span class="product-card__meta-value">{{sku}}</span>
                </div>
                {{/if}}
                
                {{#if stock}}
                <div class="product-card__stock">
                    <span class="product-card__meta-label">Stock:</span>
                    <span class="product-card__meta-value {{#if (lt stock 5)}}product-card__stock--low{{/if}}">
                        {{stock}} unidades
                    </span>
                </div>
                {{/if}}
            </div>
        </div>
    </div>
</template>

<style>
    /* Product Card Styles */
    .product-card {
        background: var(--container-color);
        border-radius: 1rem;
        overflow: hidden;
        transition: all 0.3s ease;
        border: 1px solid rgba(0, 0, 0, 0.05);
        position: relative;
        animation: fadeInUp 0.5s ease forwards;
    }

    .product-card:hover {
        transform: translateY(-5px);
        box-shadow: 0 12px 32px rgba(0, 0, 0, 0.1);
    }

    /* Badges */
    .product-card__badge {
        position: absolute;
        top: 1rem;
        left: 1rem;
        background: var(--secondary-color);
        color: white;
        padding: 0.25rem 0.75rem;
        border-radius: 2rem;
        font-size: var(--smaller-font-size);
        font-weight: var(--font-medium);
        z-index: 2;
    }

    .product-card__discount-badge {
        position: absolute;
        top: 1rem;
        right: 1rem;
        background: var(--error-color);
        color: white;
        padding: 0.25rem 0.5rem;
        border-radius: 2rem;
        font-size: var(--smaller-font-size);
        font-weight: var(--font-bold);
        z-index: 2;
    }

    .product-card__stock-badge {
        position: absolute;
        bottom: 1rem;
        left: 1rem;
        background: var(--warning-color);
        color: white;
        padding: 0.25rem 0.75rem;
        border-radius: 2rem;
        font-size: var(--smaller-font-size);
        font-weight: var(--font-medium);
        z-index: 2;
        display: flex;
        align-items: center;
        gap: 0.25rem;
    }

    /* Image */
    .product-card__image {
        position: relative;
        height: 200px;
        overflow: hidden;
        background: var(--body-color);
    }

    .product-card__img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        transition: transform 0.3s ease;
    }

    .product-card:hover .product-card__img {
        transform: scale(1.05);
    }

    /* Overlay */
    .product-card__overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.7);
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 1rem;
        opacity: 0;
        transition: opacity 0.3s ease;
    }

    .product-card__image:hover .product-card__overlay {
        opacity: 1;
    }

    .product-card__quick-view,
    .product-card__wishlist {
        width: 45px;
        height: 45px;
        background: white;
        border: none;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--title-color);
        transition: all 0.3s ease;
        cursor: pointer;
    }

    .product-card__quick-view:hover,
    .product-card__wishlist:hover {
        background: var(--primary-color);
        color: white;
        transform: translateY(-2px);
    }

    /* Content */
    .product-card__content {
        padding: 1.5rem;
    }

    .product-card__category {
        font-size: var(--small-font-size);
        color: var(--text-color-light);
        margin-bottom: 0.5rem;
        text-transform: uppercase;
        letter-spacing: 0.5px;
    }

    .product-card__title {
        font-size: var(--h3-font-size);
        margin-bottom: 0.5rem;
        line-height: 1.3;
    }

    .product-card__link {
        color: var(--title-color);
        transition: color 0.3s ease;
    }

    .product-card__link:hover {
        color: var(--primary-color);
    }

    .product-card__description {
        color: var(--text-color);
        margin-bottom: 1rem;
        font-size: var(--small-font-size);
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
        line-height: 1.4;
    }

    /* Price */
    .product-card__price {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        margin-bottom: 1rem;
    }

    .product-card__price-current {
        font-size: 1.25rem;
        font-weight: var(--font-bold);
        color: var(--primary-color);
    }

    .product-card__price-compare {
        font-size: var(--small-font-size);
        color: var(--text-color-light);
        text-decoration: line-through;
    }

    /* Specifications */
    .product-card__specs {
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
        margin-bottom: 1rem;
        padding: 1rem;
        background: var(--body-color);
        border-radius: 0.5rem;
    }

    .product-spec {
        display: flex;
        justify-content: space-between;
        font-size: var(--small-font-size);
    }

    .product-spec__key {
        font-weight: var(--font-medium);
        color: var(--title-color);
    }

    .product-spec__value {
        color: var(--text-color);
    }

    /* Actions */
    .product-card__actions {
        display: flex;
        gap: 0.5rem;
        margin-bottom: 1rem;
    }

    .product-card__add-to-cart {
        flex: 1;
        text-align: center;
        padding: 0.75rem;
        font-size: var(--small-font-size);
        font-weight: var(--font-medium);
        transition: all 0.3s ease;
    }

    .product-card__add-to-cart:disabled {
        background: var(--text-color-light);
        cursor: not-allowed;
        transform: none;
    }

    .product-card__add-to-cart:disabled:hover {
        background: var(--text-color-light);
        transform: none;
    }

    .product-card__view-details {
        padding: 0.75rem;
        font-size: var(--small-font-size);
        white-space: nowrap;
    }

    /* Meta Information */
    .product-card__meta {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding-top: 1rem;
        border-top: 1px solid var(--body-color);
        font-size: var(--smaller-font-size);
    }

    .product-card__sku,
    .product-card__stock {
        display: flex;
        align-items: center;
        gap: 0.25rem;
    }

    .product-card__meta-label {
        color: var(--text-color-light);
        font-weight: var(--font-medium);
    }

    .product-card__meta-value {
        color: var(--text-color);
    }

    .product-card__stock--low {
        color: var(--warning-color);
        font-weight: var(--font-bold);
    }

    /* List View Variant */
    .product-card--list {
        display: grid;
        grid-template-columns: 200px 1fr;
        gap: 1.5rem;
        padding: 1.5rem;
    }

    .product-card--list .product-card__image {
        height: 150px;
    }

    .product-card--list .product-card__description {
        -webkit-line-clamp: 3;
    }

    .product-card--list .product-card__specs {
        flex-direction: row;
        flex-wrap: wrap;
        gap: 1rem;
    }

    .product-card--list .product-spec {
        flex-direction: column;
        gap: 0.25rem;
        text-align: center;
        flex: 1;
        min-width: 100px;
    }

    .product-card--list .product-card__actions {
        justify-content: flex-start;
    }

    /* Grid View Variant */
    .product-card--grid {
        /* Default grid styles are already applied */
    }

    /* Small Card Variant */
    .product-card--small {
        display: grid;
        grid-template-columns: 80px 1fr;
        gap: 1rem;
        padding: 1rem;
    }

    .product-card--small .product-card__image {
        height: 80px;
    }

    .product-card--small .product-card__content {
        padding: 0;
        display: flex;
        flex-direction: column;
        justify-content: center;
    }

    .product-card--small .product-card__title {
        font-size: var(--normal-font-size);
        margin-bottom: 0.25rem;
    }

    .product-card--small .product-card__description,
    .product-card--small .product-card__specs,
    .product-card--small .product-card__meta {
        display: none;
    }

    .product-card--small .product-card__actions {
        margin-bottom: 0;
    }

    .product-card--small .product-card__add-to-cart {
        padding: 0.5rem;
        font-size: var(--smaller-font-size);
    }

    /* Animations */
    @keyframes fadeInUp {
        from {
            opacity: 0;
            transform: translateY(20px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    /* Responsive Design */
    @media screen and (max-width: 768px) {
        .product-card--list {
            grid-template-columns: 1fr;
        }

        .product-card__actions {
            flex-direction: column;
        }

        .product-card__meta {
            flex-direction: column;
            align-items: flex-start;
            gap: 0.5rem;
        }
    }

    @media screen and (max-width: 576px) {
        .product-card__content {
            padding: 1rem;
        }

        .product-card__price {
            flex-direction: column;
            align-items: flex-start;
            gap: 0.25rem;
        }

        .product-card__specs {
            padding: 0.75rem;
        }
    }

    /* Dark Theme Support */
    .dark-theme .product-card {
        background: var(--container-color-dark);
        border-color: var(--border-color-dark);
    }

    .dark-theme .product-card__specs {
        background: var(--body-color-dark);
    }

    .dark-theme .product-card__meta {
        border-top-color: var(--border-color-dark);
    }
</style>

<script>
    // Product Card Component Script
    class ProductCardComponent {
        constructor() {
            this.template = document.getElementById('product-card-template');
            this.helpers = {
                calculateDiscount: (price, comparePrice) => {
                    return Math.round(((comparePrice - price) / comparePrice) * 100);
                },
                formatPrice: (price) => {
                    return parseFloat(price).toFixed(2);
                },
                truncate: (text, length) => {
                    if (text.length <= length) return text;
                    return text.substring(0, length) + '...';
                },
                limit: (obj, count) => {
                    const limited = {};
                    let i = 0;
                    for (const [key, value] of Object.entries(obj)) {
                        if (i >= count) break;
                        limited[key] = value;
                        i++;
                    }
                    return limited;
                },
                eq: (a, b) => a === b,
                lt: (a, b) => a < b
            };
        }

        render(product, options = {}) {
            const {
                view = 'grid',
                showCategory = true,
                showDescription = true,
                showSpecs = true,
                showActions = true,
                showMeta = true,
                size = 'normal' // 'normal', 'small'
            } = options;

            // Prepare data for template
            const data = this.prepareData(product, options);
            
            // Get template HTML
            let html = this.template.innerHTML;
            
            // Replace template variables (simplified version - in production use a proper templating engine)
            html = this.compileTemplate(html, data);
            
            // Create DOM element
            const container = document.createElement('div');
            container.innerHTML = html;
            const cardElement = container.firstElementChild;
            
            // Add view class
            cardElement.classList.add(`product-card--${view}`);
            if (size !== 'normal') {
                cardElement.classList.add(`product-card--${size}`);
            }
            
            // Setup event listeners
            this.setupEventListeners(cardElement, product);
            
            return cardElement;
        }

        prepareData(product, options) {
            const category = window.productsLoader?.getCategoryById(product.category) || {};
            const wishlist = JSON.parse(localStorage.getItem('nidoBenditoWishlist') || '[]');
            const isInWishlist = wishlist.includes(product.id);

            return {
                ...product,
                categoryName: category.name || 'Sin categoría',
                mainImage: product.images?.[0] || '../assets/images/placeholder.jpg',
                wishlistIcon: isInWishlist ? 'fas fa-heart' : 'far fa-heart',
                specifications: product.specifications || {}
            };
        }

        compileTemplate(template, data) {
            return template
                .replace(/\{\{(\w+)\}\}/g, (match, key) => {
                    return data[key] || '';
                })
                .replace(/\{\{#if (\w+)\}\}(.*?)\{\{\/if\}\}/gs, (match, condition, content) => {
                    return data[condition] ? content : '';
                })
                .replace(/\{\{#each (.*?)\}\}(.*?)\{\{\/each\}\}/gs, (match, arrayPath, content) => {
                    const array = this.getNestedValue(data, arrayPath);
                    if (!Array.isArray(array)) return '';
                    
                    return array.map(item => {
                        return content.replace(/\{\{(.*?)\}\}/g, (innerMatch, innerKey) => {
                            return this.getNestedValue(item, innerKey.trim()) || '';
                        });
                    }).join('');
                });
        }

        getNestedValue(obj, path) {
            return path.split('.').reduce((current, key) => {
                return current ? current[key] : undefined;
            }, obj);
        }

        setupEventListeners(cardElement, product) {
            // Quick view
            const quickViewBtn = cardElement.querySelector('.product-card__quick-view');
            if (quickViewBtn) {
                quickViewBtn.addEventListener('click', (e) => {
                    e.preventDefault();
                    this.openQuickView(product);
                });
            }

            // Wishlist
            const wishlistBtn = cardElement.querySelector('.product-card__wishlist');
            if (wishlistBtn) {
                wishlistBtn.addEventListener('click', (e) => {
                    e.preventDefault();
                    this.toggleWishlist(product.id, wishlistBtn);
                });
            }

            // Add to cart
            const addToCartBtn = cardElement.querySelector('.product-card__add-to-cart');
            if (addToCartBtn) {
                addToCartBtn.addEventListener('click', (e) => {
                    e.preventDefault();
                    this.addToCart(product);
                });
            }

            // Prevent default link behavior for buttons
            cardElement.querySelectorAll('button').forEach(button => {
                button.addEventListener('click', (e) => {
                    if (button.classList.contains('product-card__quick-view') || 
                        button.classList.contains('product-card__wishlist') ||
                        button.classList.contains('product-card__add-to-cart')) {
                        e.preventDefault();
                    }
                });
            });
        }

        openQuickView(product) {
            // Dispatch event for other components to handle
            const event = new CustomEvent('productQuickView', {
                detail: { product }
            });
            document.dispatchEvent(event);
        }

        toggleWishlist(productId, button) {
            const wishlist = JSON.parse(localStorage.getItem('nidoBenditoWishlist') || '[]');
            const isInWishlist = wishlist.includes(productId);

            if (isInWishlist) {
                // Remove from wishlist
                const newWishlist = wishlist.filter(id => id !== productId);
                localStorage.setItem('nidoBenditoWishlist', JSON.stringify(newWishlist));
                button.innerHTML = '<i class="far fa-heart"></i>';
                this.showNotification('Producto removido de tu lista de deseos', 'info');
            } else {
                // Add to wishlist
                wishlist.push(productId);
                localStorage.setItem('nidoBenditoWishlist', JSON.stringify(wishlist));
                button.innerHTML = '<i class="fas fa-heart"></i>';
                this.showNotification('Producto agregado a tu lista de deseos', 'success');
            }

            // Update wishlist counter in header
            if (window.headerComponent) {
                window.headerComponent.updateWishlistCounter();
            }
        }

        addToCart(product) {
            const cart = JSON.parse(localStorage.getItem('nidoBenditoCart') || '[]');
            const existingItem = cart.find(item => item.productId === product.id);

            if (existingItem) {
                existingItem.quantity += 1;
            } else {
                cart.push({
                    productId: product.id,
                    quantity: 1,
                    addedAt: new Date().toISOString()
                });
            }

            localStorage.setItem('nidoBenditoCart', JSON.stringify(cart));
            
            // Update cart counter in header
            if (window.headerComponent) {
                window.headerComponent.updateCartCounter();
            }
            
            this.showNotification(`${product.name} agregado al carrito`, 'success');
            
            // Dispatch cart updated event
            const event = new CustomEvent('cartUpdated', {
                detail: { cart }
            });
            document.dispatchEvent(event);
        }

        showNotification(message, type = 'info') {
            if (window.productsLoader && window.productsLoader.showNotification) {
                window.productsLoader.showNotification(message, type);
            } else {
                // Fallback
                console.log(`${type}: ${message}`);
            }
        }

        // Batch rendering for performance
        renderMultiple(products, container, options = {}) {
            const fragment = document.createDocumentFragment();
            
            products.forEach((product, index) => {
                const card = this.render(product, options);
                
                // Stagger animation
                card.style.animationDelay = `${index * 0.1}s`;
                
                fragment.appendChild(card);
            });
            
            container.appendChild(fragment);
        }
    }

    // Initialize when DOM is loaded
    document.addEventListener('DOMContentLoaded', () => {
        window.productCardComponent = new ProductCardComponent();
    });

    // Export for use in other modules
    if (typeof module !== 'undefined' && module.exports) {
        module.exports = ProductCardComponent;
    }
</script>
